name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KartzRbx/CLPP
          path: clpp-src
      - uses: dtolnay/rust-toolchain@stable
      - name: Build clpp
        run: cargo build --release
        working-directory: clpp-src
      - name: Put clpp on PATH
        run: echo "$GITHUB_WORKSPACE/clpp-src/target/release" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Test Cluaupp
        run: npm test
      - name: CLI help
        run: node bin/cluaupp.js --help
      - name: CL++ contract
        run: npm run test:clpp-contract
